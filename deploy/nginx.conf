# Install on the separate Nginx proxy VM. Replace the hostnames and private IP.
map $uri $tcpmm_login_limit_key {
    default "";
    /api/admin/login $binary_remote_addr;
}

map $uri $tcpmm_submission_limit_key {
    default "";
    /api/show-submissions $binary_remote_addr;
    /api/show-submissions/form-token $binary_remote_addr;
}

map $uri $tcpmm_chat_limit_key {
    default "";
    /api/chat/messages $binary_remote_addr;
}

map $uri $tcpmm_chat_connection_key {
    default "";
    /api/chat/events $binary_remote_addr;
}

map $uri $tcpmm_radio_connection_key {
    default "";
    /radio/stream $binary_remote_addr;
}

limit_req_zone $binary_remote_addr zone=tcpmm_general:10m rate=120r/m;
limit_req_zone $tcpmm_login_limit_key zone=tcpmm_login:10m rate=10r/m;
limit_req_zone $tcpmm_submission_limit_key zone=tcpmm_submissions:10m rate=30r/m;
limit_req_zone $tcpmm_chat_limit_key zone=tcpmm_chat:10m rate=60r/m;
limit_conn_zone $tcpmm_chat_connection_key zone=tcpmm_chat_connections:10m;
limit_conn_zone $tcpmm_radio_connection_key zone=tcpmm_radio_connections:10m;

upstream tcpmm_app {
    server APP_VM_PRIVATE_IP:3030;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name tcpmm.wtf;

    return 308 https://tcpmm.wtf$request_uri;
}

server {
    listen 443 ssl http2;
    server_name tcpmm.wtf;

    # Configure ssl_certificate and ssl_certificate_key for this proxy VM.

    # Advertise HTTPS only after certificates and the redirect above are working.
    add_header Strict-Transport-Security "max-age=31536000" always;

    limit_req zone=tcpmm_general burst=60 nodelay;
    limit_req zone=tcpmm_login burst=5 nodelay;
    limit_req zone=tcpmm_submissions burst=10 nodelay;
    limit_req zone=tcpmm_chat burst=20 nodelay;
    limit_req_status 429;
    limit_conn tcpmm_chat_connections 6;
    limit_conn tcpmm_radio_connections 3;
    limit_conn_status 429;

    location /api/chat/events {
        proxy_pass http://tcpmm_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://tcpmm_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
