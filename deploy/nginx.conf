# Install on the separate Nginx proxy VM. Replace the hostnames and private IP.
upstream tcpmm_app {
    server APP_VM_PRIVATE_IP:3030;
    keepalive 16;
}

server {
    listen 443 ssl http2;
    server_name tcpmm.wtf;

    # Configure ssl_certificate and ssl_certificate_key for this proxy VM.

    location /api/chat/events {
        proxy_pass http://tcpmm_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://10.1.1.23:3030;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
