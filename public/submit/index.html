<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Submit a Show // TCPM&M</title>
  <link rel="stylesheet" href="/submit/submit.css" />
</head>
<body>
  <header>
    <a class="brand" href="/">TC<span>//</span>PM&M</a>
    <a class="back" href="/">← BACK TO SITE</a>
  </header>
  <main>
    <section class="intro">
      <span>[COMMUNITY INPUT]</span>
      <h1>SUBMIT<br />A SHOW.</h1>
      <p>Send the details to the crew. Submissions enter a private review queue and do not publish automatically.</p>
    </section>
    <section class="panel" aria-labelledby="form-title">
      <div class="panel-title"><span>FORM://SHOW_INTAKE</span><h2 id="form-title">SHOW DETAILS</h2></div>
      <form id="submission-form">
        <label>DATE<input name="event_date" type="date" required /></label>
        <label>SHOW TITLE<input name="title" maxlength="100" required /></label>
        <label>VENUE<input name="venue" maxlength="100" required /></label>
        <label>CITY<input name="city" maxlength="60" required /></label>
        <label class="wide">VENUE ADDRESS<input name="address" maxlength="200" autocomplete="street-address" required /></label>
        <label class="wide">LINEUP<textarea name="lineup" rows="3" maxlength="300" required></textarea></label>
        <label>GENRE<select name="genre" required><option value="">SELECT</option><option value="punk">PUNK</option><option value="metal">METAL</option><option value="hardcore">HARDCORE</option><option value="other">OTHER</option></select></label>
        <label>PRICE<input name="price" maxlength="30" placeholder="$10 / FREE / DONATION" /></label>
        <label>DOORS<input name="doors" maxlength="30" placeholder="7 PM" /></label>
        <label class="wide">DESCRIPTION<textarea name="description" rows="5" maxlength="2000" required></textarea></label>
        <label class="wide">HOW DO WE CONTACT YOU?<small>Email, phone, social handle, or another reliable method.</small><input name="contact" maxlength="300" autocomplete="email" required /></label>
        <label class="trap" aria-hidden="true">WEBSITE<input name="website" tabindex="-1" autocomplete="off" /></label>
        <button class="wide" type="submit" disabled>LOADING SECURE FORM…</button>
        <p class="status wide" id="submission-status" role="status"></p>
      </form>
    </section>
  </main>
  <footer>TRI-CITIES PUNK, METAL & MORE // COMMUNITY SHOW INTAKE</footer>
  <script type="module" src="/submit/submit.js"></script>
</body>
</html>
